<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSC Mock Analyser</title>
  <meta name="description" content="Analyse SSC mock response sheets and track progress across mocks.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233987e5'/%3E%3Cpath d='M8 22l5-6 4 3 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --bg: #ffffff; --ink: #111827; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
                 font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .fallback { position: fixed; inset: 0; display: grid; place-items: center;
                padding: 16px; text-align: center; }
    .fallback a { color: #3987e5; }
    .wake { position: fixed; right: 12px; bottom: 12px; z-index: 1; padding: 4px 10px;
            border-radius: 999px; font-size: 12px; text-decoration: none;
            color: var(--ink); background: var(--bg); border: 1px solid rgba(128,128,128,.35);
            opacity: .75; }
    .wake:hover, .wake:focus-visible { opacity: 1; }
  </style>
</head>
<body>
  <!-- The analyser itself runs on Streamlit Community Cloud (Python, OCR, Firestore).
       Netlify cannot run Python, so this page shows that app full-screen. -->
  <div class="fallback">
    <p>Loading SSC Mock Analyser… If it doesn't appear,
      <a href="https://ssc-mock-analyser-amptsrsg5qtvd7znwu2w8s.streamlit.app/">open it directly</a>.</p>
  </div>
  <iframe title="SSC Mock Analyser"
          src="https://ssc-mock-analyser-amptsrsg5qtvd7znwu2w8s.streamlit.app/~/+/?embed=true"
          allow="clipboard-write; fullscreen"></iframe>
  <!-- After a few idle days Streamlit puts the app to sleep; its wake-up button
       is only on the Streamlit page itself. -->
  <a class="wake" href="https://ssc-mock-analyser-amptsrsg5qtvd7znwu2w8s.streamlit.app/"
     target="_blank" rel="noopener">Not loading? Open on Streamlit ↗</a>
</body>
</html>
