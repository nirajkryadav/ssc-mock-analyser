    subtopics: [Noun / pronoun errors, Verb and tense errors, Preposition and article errors, Adjective / adverb errors, Practice sets]
  Sentence Improvement:
    subtopics: [Phrase replacement, Fill in the blanks, Practice sets]
  Active / Passive:
    subtopics: [Rules by tense, Imperative and question forms, Practice sets]
  Direct / Indirect:
    subtopics: [Statements, Questions, Commands and exclamations, Practice sets]
  Synonym:
    subtopics: [Root words and prefixes, Previous-year word list, Practice sets]
  Antonym:
    subtopics: [Previous-year word list, Practice sets]
  One Word Substitution:
    subtopics: [Previous-year list, Practice sets]
  Idioms and Phrases:
    subtopics: [Previous-year list, Practice sets]
  Spelling:
    subtopics: [Commonly misspelt words, Practice sets]
  Homonyms:
    subtopics: [Homonyms and homophones, Practice sets]
  Cloze Test:
    subtopics: [Grammar-based blanks, Vocabulary-based blanks, Practice sets]
  Reading Comprehension:
    subtopics: [Main idea and title, Fact-based questions, Inference and tone, Vocabulary in context]
  Para Jumbles:
    mocks: [Para Jumbles]
    subtopics: [Sentence rearrangement, Opening / closing sentence]
